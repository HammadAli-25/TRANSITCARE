<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Create Account | TransitCare</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body class="auth-page">

    <div class="auth-box">

        <!-- LOGO -->
        <div style="text-align:center;font-size:34px">
            🚍
        </div>


        <!-- PAGE HEADING -->
        <h2>
            Create your account
        </h2>

        <p class="auth-sub">
            Join TransitCare and make public transport better
        </p>


        <!-- REGISTRATION FORM -->
        <form method="POST">

            <label>
                Full name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Your name"
                required
            >


            <label>
                Email address
            </label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <!-- LOGIN LINK -->
        <p
            style="text-align:center;margin-top:20px;font-size:13px"
        >
            Already registered?

            <a href="/select/user">
                Sign in
            </a>
        </p>


        <!-- BACK TO HOME -->
        <p
            style="text-align:center;margin-top:15px"
        >
            <a href="/">
                ← Back to home
            </a>
        </p>

    </div>


    <!-- MULTILINGUAL LANGUAGE SCRIPT -->
    <script src="/static/language.js"></script>

</body>

</html>
